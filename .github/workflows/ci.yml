name: Godot 4.7 CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: read
  statuses: write

concurrency:
  group: seacraft-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_BIN_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
  GODOT_TEMPLATES_SHA256: "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"
  GUT_COMMIT: "aeb5d4f3f7f0a6c9b5e178876d6c99b791fda605"

jobs:
  foundation:
    name: FND-01 + FND-02 + FND-03 + FND-04 + FND-05 + FND-06 + VS-01 + VS-02 + VS-03 + VS-04 + CORE-01 + CORE-02 + CORE-03 + CORE-04 + AI-01 + AI-02 + AI-03 + AI-04 + NET-01 + NET-02 + NET-03 + NET-04 + PRG-01 + PRG-02 + PRG-03 + PRG-04 verification and exports
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish CI run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" \
            -d "{\"state\":\"pending\",\"context\":\"seacraft-prg04-evidence\",\"description\":\"PRG-04 CI run ${GITHUB_RUN_ID}\",\"target_url\":\"${target}\"}"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          archive="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$base/$archive"
          echo "${GODOT_BIN_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          install -m 0755 "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64" "$RUNNER_TEMP/godot/godot"
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"

      - name: Verify exact Godot version
        shell: bash
        run: |
          set -euo pipefail
          godot --version | tee "$RUNNER_TEMP/godot-version.txt"
          grep -Eq '^4\.7\.2\.stable\.official\.' "$RUNNER_TEMP/godot-version.txt"

      - name: Install pinned GUT from official upstream
        shell: bash
        run: |
          set -euo pipefail
          ./tools/ci/install_gut.sh
          test -f addons/gut/gut_cmdln.gd
          grep -q "${GUT_COMMIT}" tools/ci/install_gut.sh

      - name: Verify pinned Beehave runtime subset
        shell: bash
        run: python3 tools/ci/verify_beehave_pin.py

      - name: Import and parse project resources
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --editor --path . --quit 2>&1 | tee "$RUNNER_TEMP/project-parse.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script' "$RUNNER_TEMP/project-parse.log"; then
            exit 1
          fi

      - name: Validate project and export presets
        shell: bash
        run: godot --headless --path . --script res://tools/ci/validate_fnd01.gd

      - name: Headless project boot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --quit-after 1 2>&1 | tee "$RUNNER_TEMP/headless-boot.log"
          grep -q "SeaCraft bootstrap ready" "$RUNNER_TEMP/headless-boot.log"

      - name: GUT full suite through PRG-04
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . -s addons/gut/gut_cmdln.gd -gdir=res://tests/unit -gexit 2>&1 | tee "$RUNNER_TEMP/gut.log"
          grep -Fq "test_fnd06_save_service.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_vs01_combat.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_vs01_mobile_input.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_vs02_npc_ai.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_vs03_loot.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_core02_combat_world.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_core03_sector_map.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_core04_persistence.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_ai01_framework.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_ai02_tactical_combat.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_ai03_fleet_world.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_ai04_world_lod.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_net01_session.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_net02_replication.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_net03_vertical_slice.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_net04_lan_hardening.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_prg01_progression.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_prg02_progression.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_prg03_progression.gd" "$RUNNER_TEMP/gut.log"
          grep -Fq "test_prg04_quest.gd" "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_vs01_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_vs02_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_vs03_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_vs04_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_core01_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_core02_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_core03_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_core04_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_ai01_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_ai02_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_ai03_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_ai04_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_prg01_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_prg02_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_prg03_suite.py "$RUNNER_TEMP/gut.log"
          python3 tools/ci/verify_prg04_suite.py "$RUNNER_TEMP/gut.log"
          if grep -Eq 'SCRIPT ERROR:|Parse Error:|Failed to load script|Ignoring script|Failing Tests[[:space:]]+[1-9]|([Oo]rphans?[[:space:]]+[1-9][0-9]*|[1-9][0-9]*[[:space:]]+[Oo]rphans?)' "$RUNNER_TEMP/gut.log"; then
            echo "GUT reported a parse/load/test/orphan failure." >&2
            exit 1
          fi

      - name: NET-01 real ENet process integration
        shell: bash
        run: ./tools/ci/run_net01_process_integration.sh "$RUNNER_TEMP/net01-process.log"

      - name: Verify NET-01 contract and real process execution
        shell: bash
        run: python3 tools/ci/verify_net01_suite.py "$RUNNER_TEMP/gut.log" "$RUNNER_TEMP/net01-process.log"

      - name: NET-02 real host plus two clients ENet/RPC integration
        shell: bash
        run: ./tools/ci/run_net02_process_integration.sh "$RUNNER_TEMP/net02-process.log"

      - name: Verify NET-02 contract and real host plus two clients
        shell: bash
        run: python3 tools/ci/verify_net02_suite.py "$RUNNER_TEMP/gut.log" "$RUNNER_TEMP/net02-process.log"

      - name: NET-03 real host and client vertical-slice parity and combat disconnect
        shell: bash
        run: bash tools/ci/run_net03_process_integration.sh "$RUNNER_TEMP/net03-process.log"

      - name: Verify NET-03 offline, host and client semantic evidence
        shell: bash
        run: python3 tools/ci/verify_net03_suite.py "$RUNNER_TEMP/gut.log" "$RUNNER_TEMP/net03-process.log"

      - name: NET-04 real UDP discovery reconnect late-join and lost-ACK transaction integration
        shell: bash
        run: bash tools/ci/run_net04_process_integration.sh "$RUNNER_TEMP/net04-process.log"

      - name: Verify NET-04 discovery reconnect baseline transaction and offline gates
        shell: bash
        run: python3 tools/ci/verify_net04_suite.py "$RUNNER_TEMP/gut.log" "$RUNNER_TEMP/net04-process.log"

      - name: Verify VS-04 full integration execution
        shell: bash
        run: grep -Fq "VS04_SCENARIO_COMPLETE" "$RUNNER_TEMP/gut.log"

      - name: Verify VS-04 checkpoint replay
        shell: bash
        run: grep -Fq "VS04_CHECKPOINT_REPLAY_OK" "$RUNNER_TEMP/gut.log"

      - name: Verify VS-04 short headless soak
        shell: bash
        run: grep -Fq "VS04_SOAK_OK" "$RUNNER_TEMP/gut.log"

      - name: Verify CORE-02 target tag matrix
        shell: bash
        run: grep -Fq "CORE02_TARGET_TAG_MATRIX_OK" "$RUNNER_TEMP/gut.log"

      - name: Verify CORE-02 harpoon damage
        shell: bash
        run: grep -Fq "CORE02_HARPOON_DAMAGE_OK" "$RUNNER_TEMP/gut.log"

      - name: Verify CORE-02 duplicate spawn and claim guards
        shell: bash
        run: grep -Fq "CORE02_DUPLICATE_SPAWN_CLAIM_OK" "$RUNNER_TEMP/gut.log"

      - name: Verify CORE-02 world-object persistence
        shell: bash
        run: grep -Fq "CORE02_WORLD_PERSISTENCE_OK" "$RUNNER_TEMP/gut.log"

      - name: Verify CORE-03 transition, rebind, safe-zone, hazard, map and persistence gates
        shell: bash
        run: |
          set -euo pipefail
          for marker in             CORE03_TRANSITION_RULES_OK             CORE03_STALE_RUNTIME_OK             CORE03_MULTI_SECTOR_PERSISTENCE_OK             CORE03_SAFE_ZONE_MATRIX_OK             CORE03_HAZARD_ROUTE_OK             CORE03_MAP_TRANSFORM_OK; do
            grep -Fq "$marker" "$RUNNER_TEMP/gut.log"
          done

      - name: Verify CORE-04 persistence hardening execution
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            CORE04_MIGRATION_CHAIN_OK \
            CORE04_CONTENT_REGISTRY_OK \
            CORE04_CONTENT_HASH_MISMATCH_OK \
            CORE04_ENTITY_INDEX_OK \
            CORE04_NPC_RESUME_OK \
            CORE04_RECOVERY_OK \
            CORE04_MALFORMED_CORPUS_OK \
            CORE04_LARGE_ROUNDTRIP_OK; do
            grep -Fq "$marker" "$RUNNER_TEMP/gut.log"
          done

      - name: Verify AI-01 execution markers
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            AI01_SENSE_PIPELINE_OK \
            AI01_MEMORY_DECAY_OK \
            AI01_ROLE_UTILITY_OK \
            AI01_HYSTERESIS_OK \
            AI01_BT_LIFECYCLE_OK \
            AI01_FSM_REGRESSION_OK \
            AI01_SCHEDULER_BUDGET_OK \
            AI01_PERSISTENCE_OK; do
            grep -Fq "$marker" "$RUNNER_TEMP/gut.log"
          done

      - name: Verify AI-02 tactical execution markers
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            AI02_TACTICAL_CONTEXT_OK \
            AI02_EXPECTED_DPS_OK \
            AI02_RANGE_BROADSIDE_OK \
            AI02_AMMO_ECONOMY_OK \
            AI02_RETREAT_REPAIR_OK \
            AI02_LINE_OF_FIRE_OK \
            AI02_BOARDING_OK \
            AI02_SUPPORT_INTENT_OK \
            AI02_PERSISTENCE_OK \
            AI02_SCHEDULER_BUDGET_OK; do
            grep -Fq "$marker" "$RUNNER_TEMP/gut.log"
          done

      - name: Verify AI-03 fleet/world execution markers
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            AI03_FORMATION_SLOTS_OK \
            AI03_CONVOY_AMBUSH_OK \
            AI03_LEADER_SUCCESSION_OK \
            AI03_DOCK_QUEUE_OK \
            AI03_FACTION_RELATION_OK \
            AI03_SAFE_ZONE_PURSUIT_OK \
            AI03_WORLD_JOBS_OK \
            AI03_SUPPORT_RESPONSE_OK \
            AI03_PERSISTENCE_OK \
            AI03_FLEET_BUDGET_OK; do
            grep -Fq "$marker" "$RUNNER_TEMP/gut.log"
          done

      - name: Verify AI-04 LOD/far-world execution markers
        shell: bash
        run: |
          set -euo pipefail
          for marker in \
            AI04_LOD_TRANSITION_OK \
            AI04_LOD_HYSTERESIS_OK \
            AI04_MID_SCHEDULER_OK \
            AI04_FAR_TRAVEL_OK \
            AI04_FAR_COMBAT_REPLAY_OK \
            AI04_PATH_BUDGET_OK \
            AI04_POPULATION_CAP_OK \
            AI04_ADMIRAL_COUNTER_OK \
            AI04_PERSISTENCE_OK \
            AI04_LONG_SOAK_OK; do
            grep -Fq "$marker" "$RUNNER_TEMP/gut.log"
          done

      - name: Guard offline boot and simulation/network separation
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.gd' 'HTTPRequest|HTTPClient|WebSocketPeer|ENetMultiplayerPeer|MultiplayerAPI|SceneMultiplayer|@rpc|rpc\(|multiplayer_peer|get_remote_sender_id' src/simulation src/data src/persistence src/presentation; then
            echo "Offline-authority source unexpectedly contains network API usage outside src/network." >&2
            exit 1
          fi
          if grep -RInE --include='*.gd' 'get_tree\(\)\.multiplayer|multiplayer_peer' src/simulation; then
            echo "Simulation boundary unexpectedly depends on multiplayer APIs." >&2
            exit 1
          fi
          if grep -RInE --include='*.gd' 'PacketPeerUDP|LanDiscoveryHost|LanDiscoveryClient' src/simulation src/data src/persistence src/presentation; then
            echo "Discovery APIs must remain inside src/network." >&2
            exit 1
          fi
          if grep -RInE --include='*.gd' 'resume_token.*print|print.*resume_token' src/network; then
            echo "Raw resume-token logging is forbidden." >&2
            exit 1
          fi
          if grep -RInE --include='*.gd' 'FileAccess|DirAccess|SaveService|res://src/persistence' src/simulation; then
            echo "Simulation must not access checkpoint storage." >&2
            exit 1
          fi

      - name: Remove CI-only GUT before export and retain Beehave runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf addons/gut
          test -f addons/beehave/nodes/beehave_tree.gd
          test -f addons/beehave/nodes/leaves/action.gd
          test -f addons/beehave/LICENSE

      - name: Install official Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          templates="Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$templates" "$base/$templates"
          echo "${GODOT_TEMPLATES_SHA256}  $RUNNER_TEMP/$templates" | sha256sum -c -
          target="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          mkdir -p "$target"
          unzip -q -j "$RUNNER_TEMP/$templates" 'templates/*' -d "$target"
          test -f "$target/linux_debug.x86_64"
          test -f "$target/android_debug.apk"
          test -f "$target/android_source.zip"

          # The editor command can hang in headless CI while importing the
          # freshly installed Gradle tree. Install the exact official template
          # deterministically instead: this is the same on-disk layout Godot
          # creates for a custom Android build, with the tree hidden from the
          # resource scanner.
          rm -rf android
          mkdir -p android/build android/plugins
          unzip -q "$target/android_source.zip" -d android/build
          touch android/build/.gdignore
          printf '%s\n' "${GODOT_VERSION}.${GODOT_STATUS}" > android/.build_version
          chmod +x android/build/gradlew
          test -x android/build/gradlew
          test -f android/build/build.gradle
          grep -Fxq "${GODOT_VERSION}.${GODOT_STATUS}" android/.build_version

      - name: Install Godot 4.7 Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME must be set by the runner}"
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_bin" ]]; then
            sdkmanager_bin="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          # Android 17 is currently published as the 37.0 preview package,
          # not "platforms;android-37". Include preview channels explicitly and
          # provide the bare android-37 alias expected by integer compileSdk
          # consumers such as AGP/Godot.
          "$sdkmanager_bin" --sdk_root="$ANDROID_HOME" --channel=3 \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "platforms;android-37.0" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          if [[ ! -e "$ANDROID_HOME/platforms/android-37" ]]; then
            ln -s android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi
          test -f "$ANDROID_HOME/platforms/android-37/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.1/aapt"
          test -x "$ANDROID_HOME/platform-tools/adb"
          java -version

      - name: Create isolated Android debug keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Export Linux desktop debug build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/linux
          godot --headless --path . --export-debug "Linux Desktop" build/linux/SeaCraft.x86_64
          test -x build/linux/SeaCraft.x86_64
          test -s build/linux/SeaCraft.pck
          timeout 10s build/linux/SeaCraft.x86_64 --headless --quit-after 1 2>&1 | tee "$RUNNER_TEMP/exported-linux-boot.log"
          grep -q "SeaCraft bootstrap ready" "$RUNNER_TEMP/exported-linux-boot.log"

      - name: Export Android debug APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build/android
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' "$GITHUB_SHA" > seacraft_apk_commit.txt
          trap 'rm -f seacraft_apk_commit.txt' EXIT
          godot --headless --path . --export-debug "Android Debug" build/android/SeaCraft-debug.apk
          # Standard Godot Android exports ship raw project files as APK assets.
          unzip -p build/android/SeaCraft-debug.apk assets/seacraft_apk_commit.txt | cmp - seacraft_apk_commit.txt
          test -s build/android/SeaCraft-debug.apk
          unzip -tq build/android/SeaCraft-debug.apk
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump badging build/android/SeaCraft-debug.apk | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.osmanyildirim.seacraft'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fx "native-code: 'arm64-v8a'" "$RUNNER_TEMP/apk-badging.txt"
          grep -Fq "targetSdkVersion:'37'" "$RUNNER_TEMP/apk-badging.txt"
          "$ANDROID_HOME/build-tools/35.0.1/aapt" dump permissions build/android/SeaCraft-debug.apk | tee "$RUNNER_TEMP/apk-permissions.txt"
          grep -Fq "uses-permission: name='android.permission.INTERNET'" "$RUNNER_TEMP/apk-permissions.txt"
          grep -Fq "uses-permission: name='android.permission.ACCESS_LOCAL_NETWORK'" "$RUNNER_TEMP/apk-permissions.txt"

      - name: Record platform artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "${GITHUB_SHA}" > build/android/COMMIT_SHA.txt
          (cd build/android && sha256sum SeaCraft-debug.apk > SHA256SUMS.txt)
          printf '%s\n' "${GITHUB_SHA}" > build/linux/COMMIT_SHA.txt
          (cd build/linux && sha256sum SeaCraft.x86_64 SeaCraft.pck > SHA256SUMS.txt)
          cat build/android/SHA256SUMS.txt
          cat build/linux/SHA256SUMS.txt

      - name: Upload Android artifact
        id: android_artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaCraft-Android-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/android/SeaCraft-debug.apk
            build/android/COMMIT_SHA.txt
            build/android/SHA256SUMS.txt

      - name: Upload Linux artifact
        id: linux_artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeaCraft-Linux-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/linux/SeaCraft.x86_64
            build/linux/SeaCraft.pck
            build/linux/COMMIT_SHA.txt
            build/linux/SHA256SUMS.txt

      - name: Read back platform artifacts and verify provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_ARTIFACT_ID: ${{ steps.android_artifact.outputs.artifact-id }}
          ANDROID_UPLOAD_DIGEST: ${{ steps.android_artifact.outputs.artifact-digest }}
          LINUX_ARTIFACT_ID: ${{ steps.linux_artifact.outputs.artifact-id }}
          LINUX_UPLOAD_DIGEST: ${{ steps.linux_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          verify_artifact() {
            local artifact_id="$1"
            local upload_digest="$2"
            local label="$3"
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            local archive="$RUNNER_TEMP/$label-artifact.zip"
            local api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"
            local ok=0
            for attempt in {1..12}; do
              code="$(curl --silent --show-error --location \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --output "$archive.part" --write-out '%{http_code}' "$api" || true)"
              if [[ "$code" == "200" && -s "$archive.part" ]]; then
                mv "$archive.part" "$archive"
                ok=1
                break
              fi
              rm -f "$archive.part"
              sleep 2
            done
            [[ "$ok" == "1" ]]
            zip_sha="$(sha256sum "$archive" | awk '{print $1}')"
            [[ "$zip_sha" == "${upload_digest#sha256:}" ]]
            unpack="$RUNNER_TEMP/$label-readback"
            rm -rf "$unpack"
            mkdir -p "$unpack"
            unzip -q "$archive" -d "$unpack"
            printf '%s\n' "$GITHUB_SHA" | cmp - "$unpack/COMMIT_SHA.txt"
            (cd "$unpack" && sha256sum -c SHA256SUMS.txt)
            echo "PLATFORM_ARTIFACT_READBACK_OK platform=$label artifact_id=$artifact_id zip_sha256=$zip_sha sha=$GITHUB_SHA"
          }
          verify_artifact "$ANDROID_ARTIFACT_ID" "$ANDROID_UPLOAD_DIGEST" android
          verify_artifact "$LINUX_ARTIFACT_ID" "$LINUX_UPLOAD_DIGEST" linux

      - name: Publish final CI status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          state="failure"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            state="success"
          fi
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          target="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          curl --fail --silent --show-error --location \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}" \
            -d "{\"state\":\"${state}\",\"context\":\"seacraft-prg04-evidence\",\"description\":\"Android smoke hotfix verified CI run ${GITHUB_RUN_ID}: ${JOB_STATUS}\",\"target_url\":\"${target}\"}"
